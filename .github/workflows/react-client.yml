name: React Client CI

on:
  push:
    paths:
      - 'react-client/**'
      - '.github/workflows/react-client.yml'
  pull_request:
    paths:
      - 'react-client/**'
      - '.github/workflows/react-client.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test React Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Application
        run: npm run build
