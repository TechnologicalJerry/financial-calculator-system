name: NestJS Server CI

on:
  push:
    paths:
      - 'nest-server/**'
      - '.github/workflows/nest-server.yml'
  pull_request:
    paths:
      - 'nest-server/**'
      - '.github/workflows/nest-server.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test NestJS Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nest-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nest-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build
