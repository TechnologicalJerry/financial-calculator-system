name: Express Server CI

on:
  push:
    paths:
      - 'express-server/**'
      - '.github/workflows/express-server.yml'
  pull_request:
    paths:
      - 'express-server/**'
      - '.github/workflows/express-server.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Express Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./express-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: express-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check TypeScript
        run: npm run typecheck

      - name: Run Tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_calculator_test
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://localhost:5672
          JWT_ACCESS_SECRET: ci-test-access-secret

      - name: Build Application
        run: npm run build
